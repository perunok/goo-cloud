# goo cloud: postgres + server (the API, which also serves the dashboard at "/"), behind a Caddy reverse proxy that
# terminates HTTPS. Only the proxy publishes host ports. See deploy-manual.md and server/README.md.
#
#   cp .env.example .env   # then fill in every value marked REQUIRED
#   docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goo}
      POSTGRES_USER: ${POSTGRES_USER:-goo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (URL-safe characters only, e.g. openssl rand -hex 24)}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  server:
    build:
      # Repository root: the image also builds the dashboard.
      context: .
      dockerfile: server/Dockerfile
    image: ${GOO_IMAGE:-goo-cloud:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgresql://${POSTGRES_USER:-goo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-goo}?schema=public
      # No defaults for secrets: compose refuses to start until they are set.
      GOO_SIGNING_SECRET: ${GOO_SIGNING_SECRET:?set GOO_SIGNING_SECRET in .env (openssl rand -hex 32)}
      GOO_ADMIN_BOOTSTRAP: ${GOO_ADMIN_BOOTSTRAP:?set GOO_ADMIN_BOOTSTRAP in .env (JSON array, see .env.example)}
      GOO_BASE_URL: ${GOO_BASE_URL:-http://localhost}
      GOO_ALLOWED_ORIGINS: ${GOO_ALLOWED_ORIGINS:-}
      GOO_RATE_LIMIT_STORE: ${GOO_RATE_LIMIT_STORE:-memory}
      # The proxy is on the internal network, so its X-Forwarded-For is trustworthy (real client IP for rate limiting).
      GOO_TRUST_PROXY: "true"
      # Secure cookies need HTTPS. Set to true when using deploy/Caddyfile.https (see .env.example).
      GOO_COOKIE_SECURE: ${GOO_COOKIE_SECURE:-false}
    expose:
      - "8080"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - server
    environment:
      GOO_DOMAIN: ${GOO_DOMAIN:-localhost}
    ports:
      - "${GOO_HTTP_PORT:-80}:80"
      - "${GOO_HTTPS_PORT:-443}:443"
    volumes:
      # HTTP (default) or HTTPS: set GOO_CADDYFILE=./deploy/Caddyfile.https for automatic Let's Encrypt.
      - ${GOO_CADDYFILE:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
