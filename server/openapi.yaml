          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: |-
        Changing `platform_role`, or modifying/disabling any platform admin, requires super_admin. The super admin's role cannot change and nobody can disable themselves. Disabling revokes all sessions, refresh tokens and access tokens. `must_change_password: true` makes every route except GET /v1/me, POST /v1/me/password and logout answer `403 password_change_required` for that user (existing sessions included) until they change their password; `false` lifts the requirement.

        **Access:** platform_admin or super_admin for regular users; super_admin only for roles and for other admins.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      requestBody:
        required: true
        content:
