        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: |-
        Generates a random temporary password (returned ONCE in `temporary_password`), sets `must_change_password`, and signs the user out everywhere (dashboard sessions, refresh tokens and access tokens). Same authorization as PATCH: platform admins may reset regular users, only the super admin may reset another platform admin; nobody resets their own password here (use POST /v1/me/password), so the super admin's password cannot be reset through the API.

