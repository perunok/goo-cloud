                  changes:
                    type: array
                    items:
                      type: object
                      properties:
                        note_id:
                          type: string
                        path:
                          type: string
                        version:
                          type: integer
                        deleted:
                          type: boolean
                        content_hash:
                          type: string
                          nullable: true
                        content:
                          type: string
                          nullable: true
                        seq:
                          type: integer
                      required:
                        - note_id
                        - path
                        - version
                        - deleted
                        - content_hash
                        - content
                        - seq
                      additionalProperties: false
                  checkpoint:
                    type: integer
                  has_more:
                    type: boolean
                required:
                  - changes
                  - checkpoint
                  - has_more
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: |-
        Each changed note appears once with its latest state (edits made while a device was offline are coalesced), ordered by `seq`. `content` and `content_hash` are null for tombstones. `after=0` is the initial download and leaves tombstones out; later pages and pulls deliver them (ignore tombstones of unknown notes). A page holds at most `limit` changes and about 8 MiB of content (always at least one change). Store the returned `checkpoint` only after applying the page.

        **Access:** any active workspace member, or platform admin.
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: client_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: after
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      x-access: any active workspace member, or platform admin
