  /v1/workspaces/{workspaceId}/sync/push:
    post:
      operationId: postV1WorkspacesWorkspaceIdSyncPush
      summary: Push note changes. Each change is accepted or rejected on its own.
      tags:
        - Sync
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: array
                    items:
                      type: object
                      properties:
                        op_id:
                          type: string
                        note_id:
                          type: string
                        version:
                          type: integer
                        seq:
                          type: integer
                      required:
                        - op_id
                        - note_id
                        - version
                        - seq
                      additionalProperties: false
                  rejected:
                    type: array
                    items:
                      type: object
                      properties:
                        op_id:
                          type: string
                        note_id:
                          type: string
                        reason:
                          type: string
                          enum:
                            - version_mismatch
                            - path_taken
                            - not_found
                            - too_large
                            - invalid
                            - forbidden
                        message:
                          type: string
                        current:
                          type: object
                          properties:
                            version:
                              type: integer
                            path:
                              type: string
                            deleted:
                              type: boolean
                            content:
                              type: string
                              nullable: true
                          required:
                            - version
                            - path
                            - deleted
                            - content
                          additionalProperties: false
                          nullable: true
                      required:
                        - op_id
                        - note_id
                        - reason
                        - message
                        - current
                      additionalProperties: false
                  checkpoint:
                    type: integer
                required:
                  - accepted
                  - rejected
                  - checkpoint
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: |-
        At most 200 changes; the body limit of this route is larger than elsewhere (GOO_SYNC_BODY_LIMIT_BYTES, default 26 MiB, so one note always fits; clients batch by about 8 MiB of content). Changes apply in array order, each in its own transaction, and are idempotent by `op_id`: a replayed change returns its original answer and changes nothing. `base_version` is 0 for a new note and otherwise the version the client last saw. On upsert `path` and `content` are each optional (absent = unchanged); a new note needs both. Content is at most 4194304 UTF-8 bytes; `content_hash` (SHA-256) is computed by the server. Paths are relative, `/`-separated, case-insensitively unique among live notes and end in .md, .markdown, .mdown or .mkd. A delete leaves a tombstone; an upsert with the tombstone's version revives it. Rejection `reason`s: `version_mismatch` (with `current`), `path_taken` (with `current` when the note exists), `not_found`, `too_large`, `invalid`, `forbidden` (the caller is a viewer: every change is refused, nothing is written). The client branches on `reason`, never on the HTTP status. `checkpoint` is the workspace checkpoint after the push (do not advance the pull checkpoint with it).

        **Access:** any active member (changes of viewers are rejected `forbidden`), or platform admin.
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  minLength: 1
                  maxLength: 64
                changes:
                  type: array
                  items:
                    type: object
                    properties:
                      op_id:
                        type: string
                        minLength: 1
                        maxLength: 64
                      note_id:
                        type: string
                        minLength: 1
                        maxLength: 64
                      op:
                        type: string
                        enum:
                          - upsert
                          - delete
                      base_version:
                        type: integer
                        minimum: 0
                      path:
                        type: string
                      content:
                        type: string
                    required:
                      - op_id
                      - note_id
                      - op
                      - base_version
                    additionalProperties: false
                  maxItems: 200
              required:
                - client_id
                - changes
              additionalProperties: false
      x-access: any active member (changes of viewers are rejected `forbidden`), or platform admin
  /v1/workspaces/{workspaceId}/sync/pull:
    get:
      operationId: getV1WorkspacesWorkspaceIdSyncPull
      summary: Pull the notes changed after a checkpoint (repeat with the returned checkpoint while has_more)
      tags:
        - Sync
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: OK
          content:
