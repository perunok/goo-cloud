components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: goo_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with cookieAuth on POST/PUT/PATCH/DELETE.
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unauthenticated
                - forbidden
                - not_found
                - conflict
                - rate_limited
                - workspace_access_denied
                - version_mismatch
                - csrf_invalid
                - origin_not_allowed
                - password_change_required
                - internal_error
            message:
              type: string
            details:
              type: object
              additionalProperties: {}
            request_id:
              type: string
          required:
            - code
            - message
            - details
            - request_id
          additionalProperties: false
      required:
        - error
      additionalProperties: false
