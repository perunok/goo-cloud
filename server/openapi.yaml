                  minLength: 1
                  maxLength: 100
                platform_role:
                  type: string
                  enum:
                    - platform_admin
                    - user
                disabled:
                  type: boolean
                must_change_password:
                  type: boolean
              additionalProperties: false
      x-access: platform_admin or super_admin for regular users; super_admin only for roles and for other admins
