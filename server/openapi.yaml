openapi: 3.0.3
info:
  title: goo cloud API
  version: 1.0.0
  description: |-
    Generated from the zod schemas of the routes registered in `server/src`; do not edit by hand (`npm run openapi`).

    Auth: `Authorization: Bearer <access token>` (desktop) or the `goo_session` httpOnly cookie (dashboard). Cookie-authenticated unsafe requests must send `X-CSRF-Token` (from `POST /v1/auth/browser/login` or `GET /v1/auth/browser/session`).

    Every response carries `X-Request-Id`, echoed in `error.request_id`. List endpoints use cursor pagination (`?cursor=&limit=&order=`) and return `{ items, page: { next_cursor, has_more } }`.

    Note sync: `POST /v1/sync/clients/register`, then `GET .../sync/pull` and `POST .../sync/push` per workspace; push rejections carry a `reason` to branch on.

    The same routes are reachable at `/v1/...` and, for the dashboard, `/api/v1/...`.
servers:
  - url: http://localhost:8080
    description: Direct to the server container
tags:
  - name: System
  - name: Auth
  - name: Workspaces
  - name: Membership
  - name: Notes
  - name: Sync
  - name: Admin
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness/readiness probe; verifies the database is reachable (503 otherwise)
      tags:
        - System
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                  timestamp:
                    type: string
                required:
                  - status
                  - timestamp
                additionalProperties: false
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                  timestamp:
                    type: string
                required:
                  - status
                  - timestamp
                additionalProperties: false
  /device:
    get:
      operationId: getDevice
      summary: Device login approval page (HTML). Open from `verification_uri_complete`.
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
      parameters:
        - name: user_code
          in: query
          required: false
          schema:
            type: string
            maxLength: 16
    post:
      operationId: postDevice
      summary: Submit code + email + password (urlencoded form) to approve a device login
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: Rate limited per IP+email pair like the login endpoints. Accounts that must change an admin-issued password are refused (403 page with instructions) until they have done so in the dashboard.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                user_code:
                  type: string
                  minLength: 4
                  maxLength: 16
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
              required:
                - user_code
                - email
                - password
              additionalProperties: false
  /v1/auth/browser/login:
    post:
      operationId: postV1AuthBrowserLogin
      summary: Dashboard login (email + password). Sets the httpOnly session cookie and returns the CSRF token.
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      display_name:
                        type: string
                      platform_role:
                        type: string
                        enum:
                          - super_admin
                          - platform_admin
                          - user
                      must_change_password:
                        type: boolean
                    required:
                      - id
                      - email
                      - display_name
                      - platform_role
                      - must_change_password
                    additionalProperties: false
                  csrf_token:
                    type: string
                required:
                  - user
                  - csrf_token
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: "Rate limited per IP+email pair (default 10 attempts / 5 minutes, 429 rate_limited). Cookie: `goo_session`, httpOnly, SameSite=Lax, Secure when GOO_COOKIE_SECURE is true (default in production). Each successful sign-in is audited (`auth.login`)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
              required:
                - email
                - password
              additionalProperties: false
  /v1/auth/device/start:
    post:
      operationId: postV1AuthDeviceStart
      summary: Start the desktop device login flow
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_code:
                    type: string
                  user_code:
                    type: string
                  verification_uri:
                    type: string
                  verification_uri_complete:
                    type: string
                  expires_in:
                    type: integer
                  interval:
                    type: integer
                required:
                  - device_code
                  - user_code
                  - verification_uri
                  - verification_uri_complete
                  - expires_in
                  - interval
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                device_name:
                  type: string
                  minLength: 1
                  maxLength: 200
              required:
                - client_name
                - device_name
              additionalProperties: false
  /v1/auth/device/poll:
    post:
      operationId: postV1AuthDevicePoll
      summary: Poll a device login; returns tokens once approved (exactly once)
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - pending
                    required:
                      - status
                    additionalProperties: false
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - expired
                    required:
                      - status
                    additionalProperties: false
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - denied
                      reason:
                        type: string
                        enum:
                          - password_change_required
                      message:
                        type: string
                    required:
                      - status
                      - reason
                      - message
                    additionalProperties: false
                  - type: object
                    properties:
                      access_token:
                        type: string
                      refresh_token:
                        type: string
                      expires_in:
                        type: integer
                      token_type:
                        type: string
                        enum:
                          - Bearer
                      status:
                        type: string
                        enum:
                          - approved
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                          email:
                            type: string
                          display_name:
                            type: string
                          platform_role:
                            type: string
                            enum:
                              - super_admin
                              - platform_admin
                              - user
                          must_change_password:
                            type: boolean
                        required:
                          - id
                          - email
                          - display_name
                          - platform_role
                          - must_change_password
                        additionalProperties: false
                    required:
                      - access_token
                      - refresh_token
                      - expires_in
                      - token_type
                      - status
                      - user
                    additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: "`denied` (reason `password_change_required`) means the approving account must change its admin-issued password first; the flow is finished and no tokens are issued."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_code:
                  type: string
                  minLength: 8
                  maxLength: 200
              required:
                - device_code
              additionalProperties: false
  /v1/auth/refresh:
    post:
      operationId: postV1AuthRefresh
      summary: Rotate a refresh token for a new access/refresh pair
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  expires_in:
                    type: integer
                  token_type:
                    type: string
                    enum:
                      - Bearer
                required:
                  - access_token
                  - refresh_token
                  - expires_in
                  - token_type
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: Refresh tokens are single-use. Presenting an already-used token revokes every refresh token of that user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  minLength: 8
                  maxLength: 500
              required:
                - refresh_token
              additionalProperties: false
  /v1/auth/device/approve:
    post:
      operationId: postV1AuthDeviceApprove
      summary: Approve a pending device login (used by the dashboard for the signed-in user)
      tags:
        - Auth
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: Binds the pending device flow with this `user_code` to the caller. Cookie callers must send X-CSRF-Token. Refused with `403 password_change_required` while the caller must change their password. Audited (`auth.device_approved`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_code:
                  type: string
                  minLength: 4
                  maxLength: 16
              required:
                - user_code
              additionalProperties: false
  /v1/auth/logout:
    post:
      operationId: postV1AuthLogout
      summary: Revoke a refresh token (desktop logout). Always succeeds.
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  minLength: 8
                  maxLength: 500
              required:
                - refresh_token
              additionalProperties: false
  /v1/auth/browser/logout:
    post:
      operationId: postV1AuthBrowserLogout
      summary: "Dashboard logout: deletes the server-side session and clears the cookie"
      tags:
        - Auth
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
                additionalProperties: false
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: Also usable while the account must change its password (`must_change_password`); every route without this note answers `403 password_change_required` then.
  /v1/auth/browser/session:
    get:
      operationId: getV1AuthBrowserSession
      summary: "Current dashboard session: user + CSRF token (recoverable after a page reload)"
      tags:
        - Auth
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      display_name:
                        type: string
                      platform_role:
                        type: string
                        enum:
                          - super_admin
                          - platform_admin
                          - user
                      must_change_password:
                        type: boolean
                    required:
                      - id
                      - email
                      - display_name
                      - platform_role
                      - must_change_password
                    additionalProperties: false
                  csrf_token:
                    type: string
                required:
                  - user
                  - csrf_token
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: |-
        The CSRF token is HMAC-derived from the session id, so it can be re-issued without rotating. Only readable by allowlisted/same origins (CORS).

        Also usable while the account must change its password (`must_change_password`); every route without this note answers `403 password_change_required` then.
  /v1/me:
    get:
      operationId: getV1Me
      summary: Current user and their active workspace memberships
      tags:
        - Auth
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      display_name:
                        type: string
                      platform_role:
                        type: string
                        enum:
                          - super_admin
                          - platform_admin
                          - user
                      must_change_password:
                        type: boolean
                    required:
                      - id
                      - email
                      - display_name
                      - platform_role
                      - must_change_password
                    additionalProperties: false
                  workspace_memberships:
                    type: array
                    items:
                      type: object
                      properties:
                        workspace_id:
                          type: string
                        role:
                          type: string
                          enum:
                            - owner
                            - admin
                            - editor
                            - viewer
                      required:
                        - workspace_id
                        - role
                      additionalProperties: false
                required:
                  - user
                  - workspace_memberships
                additionalProperties: false
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: Also usable while the account must change its password (`must_change_password`); every route without this note answers `403 password_change_required` then.
  /v1/me/password:
    post:
      operationId: postV1MePassword
      summary: Change own password; signs out every other session and device
      tags:
        - Auth
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: |-
        Policy: 12-256 characters and different from the current password. A wrong `current_password` answers `403 forbidden` with `details.reason: invalid_current_password`. Rate limited per user like the login endpoints (`429 rate_limited`, `Retry-After`). On success `must_change_password` is cleared, every refresh token is revoked, every access token issued so far stops working and every dashboard session except the caller's own cookie session is deleted (a Bearer caller must sign in again).

        Also usable while the account must change its password (`must_change_password`); every route without this note answers `403 password_change_required` then.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  minLength: 1
                  maxLength: 256
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 256
              required:
                - current_password
                - new_password
              additionalProperties: false
  /v1/workspaces:
    get:
      operationId: getV1Workspaces
      summary: Workspaces the caller is an active member of (with the caller's role)
      tags:
        - Workspaces
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        slug:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        owner_user_id:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        version:
                          type: integer
                        role:
                          type: string
                          enum:
                            - owner
                            - admin
                            - editor
                            - viewer
                        joined_at:
                          type: string
                          format: date-time
                        added_by:
                          type: object
                          properties:
                            id:
                              type: string
                            display_name:
                              type: string
                          required:
                            - id
                            - display_name
                          additionalProperties: false
                          nullable: true
                      required:
                        - id
                        - slug
                        - name
                        - description
                        - owner_user_id
                        - created_at
                        - updated_at
                        - version
                        - role
                        - joined_at
                        - added_by
                      additionalProperties: false
                  page:
                    type: object
                    properties:
                      next_cursor:
                        type: string
                        nullable: true
                      has_more:
                        type: boolean
                    required:
                      - next_cursor
                      - has_more
                    additionalProperties: false
                required:
                  - items
                  - page
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: Platform admins see every workspace via GET /v1/admin/workspaces instead.
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
    post:
      operationId: postV1Workspaces
      summary: Create a workspace (a synced notes folder); the caller becomes its owner
      tags:
        - Workspaces
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    type: object
                    properties:
                      id:
                        type: string
                      slug:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      owner_user_id:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                      version:
                        type: integer
                    required:
                      - id
                      - slug
                      - name
                      - description
                      - owner_user_id
                      - created_at
                      - updated_at
                      - version
                    additionalProperties: false
                required:
                  - workspace
                additionalProperties: false
        "400":
          description: Invalid request (zod validation failed, malformed JSON, bad cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict / version_mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                slug:
                  type: string
                  minLength: 3
                  maxLength: 63
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                description:
                  type: string
                  maxLength: 2000
                  default: ""
              required:
                - name
              additionalProperties: false
  /v1/workspaces/{workspaceId}:
    get:
      operationId: getV1WorkspacesWorkspaceId
      summary: Workspace metadata and the caller's membership
      tags:
        - Workspaces
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    type: object
                    properties:
                      id:
                        type: string
                      slug:
                        type: string
                      name:
                        type: string
                      description:
